<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}manuel@portfolio:~${{ else }}{{ .Title }} | Manuel Scionti{{ end }}</title>
    <meta name="description" content="{{ .Site.Params.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="terminal">
        <div class="window">
            <div class="window-header">
                <div class="window-btn red"></div>
                <div class="window-btn yellow"></div>
                <div class="window-btn green"></div>
                <div class="window-title">manuel@portfolio:~{{ if not .IsHome }}/{{ .Section }}{{ end }}</div>
            </div>
            <div class="window-body">
                {{ block "main" . }}{{ end }}

                <!-- Footer -->
                <div class="footer">
                    <span style="color: var(--green);">exit 0</span> · Built with curiosity · 
                    <a href="https://github.com/mnlscn" target="_blank">Source on GitHub</a>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/main.js"></script>
</body>
</html>
