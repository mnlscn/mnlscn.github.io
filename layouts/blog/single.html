{{ define "main" }}
<!-- Back Link -->
<a href="/" class="back-link">
    <span>←</span> cd ~/portfolio
</a>

<!-- Command -->
<div class="line">
    <span class="prompt">$</span>
    <span class="command"> cat</span>
    <span class="arg"> blog/{{ .File.BaseFileName }}.md</span>
</div>

<!-- Blog Post -->
<div class="blog-post">
    <div class="blog-post-header">
        <div class="blog-post-meta">
            <span>📅 {{ .Date.Format "January 2, 2006" }}</span>
            <span>·</span>
            <span>⏱️ {{ .ReadingTime }} min read</span>
        </div>
        <h1 class="blog-post-title">{{ .Title }}</h1>
        {{ if .Params.tags }}
        <div class="blog-post-tags">
            {{ range .Params.tags }}
            <span class="tech">{{ . }}</span>
            {{ end }}
        </div>
        {{ end }}
    </div>

    <div class="blog-post-content">
        {{ .Content }}
    </div>
</div>

<!-- Navigation -->
<div class="input-area">
    <div class="line">
        <span class="comment"># Navigate</span>
    </div>
    <div style="display: flex; gap: 12px; margin-top: 12px;">
        <a href="/" class="nav-cmd">
            <span class="cmd-prefix">cd</span> ~/
        </a>
        <a href="/#blog" class="nav-cmd" onclick="setTimeout(() => showSection('blog'), 100)">
            <span class="cmd-prefix">ls</span> blog/
        </a>
    </div>
</div>
{{ end }}
